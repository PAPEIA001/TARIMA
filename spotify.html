<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTIENDO LA TARIMA · Spotify</title>
<link rel="stylesheet" href="brand.css?v=1795284827">
<script src="compat.js?v=1795284827"></script>
<style>
html,body{margin:0;height:100%;background:#0a0810;color:#f5f1f8;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:5vw;box-sizing:border-box}
.logo{font-size:56px;margin-bottom:24px}
p{font-size:22px;max-width:40em;margin:12px auto}
a{color:#1ed760;font-weight:700}
</style>
</head>
<body>
<div><div class="logo" id="logo"></div><p id="msg">🟢 Conectando con Spotify…</p></div>
<script src="shared.js?v=1795284827"></script>
<script src="spotify.js?v=1795284827"></script>
<script>
(function () {
  "use strict";
  document.getElementById("logo").innerHTML = T.logo();
  var msg = document.getElementById("msg");
  T.spotify.finish(new URLSearchParams(location.search)).then(function (back) {
    msg.textContent = "✅ Spotify conectado. Volviendo a la tele…";
    setTimeout(function () { location.replace(back || "tele.html"); }, 900);
  }, function (e) {
    msg.innerHTML = "❌ " + T.esc(e.message) + '<br><a href="tele.html">Volver</a>';
  });
})();
</script>
</body>
</html>
