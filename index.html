<link rel="stylesheet" href="app.css?v=1795269437">

<script>window.mqtt || document.write('<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"><\/script>');</script>
<script src="shared.js?v=1795269437"></script>

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="quiz" id="quiz" role="dialog" aria-modal="true" aria-labelledby="qzQ" hidden></div>
<script>
(function () {
"use strict";
var ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
  queue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h12M4 12h12M4 18h8"/><path d="M19 14v6m-3-3h6"/></svg>',
  music:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  party:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg>',
  skip:'<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
  mic:'<svg viewBox="0 0 40 40" fill="none"><circle cx="24" cy="14" r="10" fill="#ff3d7f"/><path d="M17 21 5 33l2 2 12-12" stroke="#ffb547" stroke-width="4" stroke-linecap="round"/></svg>'
};
var $app = document.getElementById("app");
var params = new URLSearchParams(location.search);
var S = {
  cid: T.store("cid") || T.rand(10),
  session: T.store("session"), profile: T.store("profile") || { tastes: [], artists: "", avatar: "" },
  conn: null, code: null, topics: null, state: null, config: null, cat: null, av: {}, lastState: 0, linkCount: 0,
  tab: "home", chip: "foryou", q: "", yt: null, ytBusy: false, pending: {}, draftAvatar: null
};
T.store("cid", S.cid);
var esc = T.esc;

/* ---------- connection ---------- */
function openConn(code) {
  if (S.conn && S.code === code) return;
  S.code = code; S.topics = T.topics(code); S.state = null; S.config = null; S.cat = null; S.av = {};
  S.conn = T.connect([S.topics.state, S.topics.res(S.cid), S.topics.config, S.topics.catalog, S.topics.avAll, S.topics.say], onMsg, function (n, why) {
    S.linkCount = n; S.libMissing = why === "nolib"; paintConn();
  });
}
var softT;
function soft() { clearTimeout(softT); softT = setTimeout(function () { if (S.session) render(true); }, 150); }
function onMsg(topic, m) {
  if (!S.topics || !m) return;
  if (topic === S.topics.config) {
    if (m.code !== S.code) return;
    S.config = m; T.applyColor(m.color);
    if (S.session) soft(); else paintHead();
  } else if (topic === S.topics.catalog) {
    S.cat = m; soft();
  } else if (topic.indexOf(S.topics.base + "/av/") === 0) {
    if (m.img) { S.av[topic.split("/").pop()] = m.img; soft(); }
  } else if (topic === S.topics.state) {
    if (!S.state || (m.ts || 0) >= (S.state.ts || 0)) {
      var prevMode = S.state && S.state.mode;
      S.state = m; S.lastState = Date.now();
      if (prevMode && m.mode !== prevMode) { S.yt = null; toast(m.mode === "music" ? "La fiesta ha pasado a modo música 🎵" : "¡Vuelve el karaoke! 🎤"); }
      if (S.session) { soft(); paintQuiz(); }
    }
  } else if (topic === S.topics.say) {
    if (S.voiceHere && m.text && Date.now() - (m.at || 0) < 30000) T.speak(m.text, { lang: m.lang, gender: m.gender });
  } else if (topic === S.topics.res(S.cid) && m.rid && S.pending[m.rid]) {
    var p = S.pending[m.rid]; delete S.pending[m.rid]; clearTimeout(p.t); p.cb(m);
  }
}
function waitLinked(ms) {
  return new Promise(function (res) {
    var t0 = Date.now();
    (function chk() { if (S.linkCount > 0) return res(true); if (Date.now() - t0 > ms) return res(false); setTimeout(chk, 200); })();
  });
}
function send(cmd, timeout) {
  return new Promise(function (resolve) {
    var rid = T.rand(10);
    cmd.rid = rid; cmd.cid = S.cid;
    if (S.session) { cmd.auth = S.session.auth; cmd.name = S.session.name; }
    S.pending[rid] = { cb: resolve, t: setTimeout(function () { delete S.pending[rid]; resolve({ ok: false, err: "timeout" }); }, timeout || 8000) };
    S.conn.publish(S.topics.cmd, cmd);
  });
}
function publishAvatar() {
  if (S.profile.avatar && S.conn) S.conn.publish(S.topics.av(S.cid), { img: S.profile.avatar, name: S.session ? S.session.name : "" }, true);
}
function errText(r) {
  var map = {
    timeout: "La tele no responde. Comprueba que tiene abierta la pantalla de Tarima.",
    auth: "Esa no es la contraseña de esta fiesta. Es la de invitados que sale en el panel de administrador (o la clave de anfitrión).",
    limit: "Ya tienes el máximo de canciones en cola. Espera a que suene una.",
    dup: "Ya tienes esa canción en la cola.",
    badurl: "No reconozco ese enlace de YouTube.",
    host: "Solo el anfitrión puede hacer eso.",
    nokey: "La búsqueda en YouTube no está activada todavía. Elige del catálogo o pega un enlace.",
    musiconly: "Ahora la fiesta está en modo música: busca la canción en YouTube o pega un enlace.",
    search: "La búsqueda de YouTube ha fallado. Prueba otra vez o pega un enlace.",
    noguests: "Todavía no hay invitados para elegir.",
    nopoints: "Todavía nadie tiene puntos en el juego de preguntas.",
    late: "Se acabó el tiempo.",
    fewguests: "Hacen falta al menos dos invitados para esa prueba."
  };
  return r.msg || map[r.err] || "Algo ha fallado. Prueba otra vez.";
}
var toastT;
function toast(msg, bad) {
  var el = document.getElementById("toast");
  el.textContent = msg; el.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastT); toastT = setTimeout(function () { el.className = "toast" + (bad ? " bad" : ""); }, 2800);
}
function face(cid, name, px) {
  var img = cid === S.cid ? (S.profile.avatar || S.av[cid]) : S.av[cid];
  return img ? '<img class="avimg" src="' + img + '" alt="" style="width:' + px + "px;height:" + px + 'px">' : T.avatar(name, px);
}

/* ---------- login ---------- */
function tasteChips(sel) {
  return '<div class="chips wrap" role="group" aria-label="Tus estilos">' + T.TASTES.map(function (t) {
    return '<button type="button" class="chip" data-taste="' + t.k + '" aria-pressed="' + (sel.indexOf(t.k) >= 0) + '">' + esc(t.label) + "</button>";
  }).join("") + "</div>";
}
function selfieBlock() {
  var a = S.draftAvatar || S.profile.avatar;
  return '<div class="selfie"><label class="selfiebtn" for="selfieIn">' + (a ? '<img src="' + a + '" alt="Tu avatar festivo">' : '<span>📸</span>') + "</label>" +
    '<div><b>' + (a ? "¡Así saldrás en la tele!" : "Hazte un selfie") + '</b><small class="muted">' + (a ? "Toca la foto para repetirla." : "Te ponemos un sombrero de fiesta y saldrás así cuando te toque cantar. Opcional.") + "</small></div>" +
    '<input type="file" id="selfieIn" accept="image/*" capture="user" hidden></div>';
}
function bindProfileInputs(root) {
  root.querySelectorAll("[data-taste]").forEach(function (b) {
    b.addEventListener("click", function () { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); });
  });
  var si = root.querySelector("#selfieIn");
  if (si) si.addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var box = root.querySelector(".selfie"); box.classList.add("busy");
    T.festive(f, getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ff3d7f").then(function (url) {
      S.draftAvatar = url; box.outerHTML = selfieBlock(); bindProfileInputs(root);
    }).catch(function () { box.classList.remove("busy"); toast("No he podido usar esa foto. Prueba otra vez.", true); });
  });
}
function readProfile(root) {
  var tastes = [];
  root.querySelectorAll("[data-taste]").forEach(function (b) { if (b.getAttribute("aria-pressed") === "true") tastes.push(b.dataset.taste); });
  var ar = root.querySelector("#lArt");
  return { tastes: tastes, artists: ar ? ar.value.trim().slice(0, 200) : "", avatar: S.draftAvatar || S.profile.avatar || "" };
}
function renderLogin(prefill) {
  prefill = prefill || {};
  var code = prefill.code || params.get("p") || (S.session && S.session.code) || "";
  $app.innerHTML = '<form class="login" id="lf" novalidate>' +
    '<div id="partyHead"><div class="logo">' + ICON.mic + 'Tarima</div>' +
    '<p class="muted" style="margin:6px 0 22px">Entra a la fiesta y pide tu canción.</p></div>' +
    '<div class="field"><label for="lc">Código de la fiesta</label><input id="lc" value="' + esc(code) + '" autocapitalize="characters" autocomplete="off" maxlength="8" placeholder="Sale en la tele" required></div>' +
    '<div class="field"><label for="ln">Tu nombre</label><input id="ln" value="' + esc(prefill.name || (S.session && S.session.name) || "") + '" autocomplete="nickname" maxlength="16" placeholder="Así saldrás en la tele" required></div>' +
    '<div class="field"><label for="lp">Contraseña de la fiesta</label><input id="lp" type="password" autocomplete="current-password" placeholder="Te la da el anfitrión" required></div>' +
    selfieBlock() +
    '<div class="field" style="margin-top:14px"><label>¿Qué música te gusta?</label>' + tasteChips(S.profile.tastes || []) + "</div>" +
    '<div class="field"><label for="lArt">Artistas favoritos (opcional)</label><input id="lArt" value="' + esc(S.profile.artists || "") + '" placeholder="Rosalía, Queen, Bad Bunny…" maxlength="200"></div>' +
    '<button class="btn" id="lb" type="submit">Entrar a la fiesta</button>' +
    '<p class="err" id="le" role="alert">' + esc(prefill.err || "") + '</p>' +
    '<p style="text-align:center;margin-top:18px"><a class="link" href="admin.html">¿Organizas fiestas? Panel de administrador</a></p></form>';
  var form = document.getElementById("lf");
  bindProfileInputs(form);
  if (code) { openConn(code.toUpperCase()); paintHead(); }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var c = document.getElementById("lc").value.trim().toUpperCase();
    var n = document.getElementById("ln").value.trim().replace(/\s+/g, " ");
    var p = document.getElementById("lp").value;
    var le = document.getElementById("le"), lb = document.getElementById("lb");
    if (!c || !n || !p) { le.textContent = "Rellena el código, tu nombre y la contraseña."; return; }
    S.profile = readProfile(form); T.store("profile", S.profile);
    lb.disabled = true; lb.textContent = "Conectando…"; le.textContent = "";
    login(c, n, p).then(function (msg) {
      if (msg) { lb.disabled = false; lb.textContent = "Entrar a la fiesta"; le.textContent = msg; }
    });
  });
}
function paintHead() {
  var el = document.getElementById("partyHead"), c = S.config;
  if (!el || !c) return;
  el.innerHTML = (c.photo ? '<div class="banner" style="background-image:url(\'' + c.photo + '\')"></div>' : '<div class="logo">' + ICON.mic + "Tarima</div>") +
    '<h1 style="font-size:30px;margin-top:14px">' + esc(c.name) + "</h1>" +
    '<p class="muted" style="margin:6px 0 18px">' + esc(c.welcome || "Entra a la fiesta y pide tu canción.") + "</p>";
}
function joinCmd() { return { type: "join", tastes: S.profile.tastes || [], artists: S.profile.artists || "" }; }
function login(code, name, pw) {
  openConn(code);
  return T.hash(code + ":" + T.pw(pw)).then(function (auth) {
    return waitLinked(10000).then(function (ok) {
      if (!ok) return S.libMissing ? "No se ha podido cargar la app. Recarga la página." : "Sin conexión con el servidor. Revisa tu internet y prueba otra vez.";
      S.session = { code: code, name: name, auth: auth };
      return send(joinCmd()).then(function (r) {
        if (!r.ok) { S.session = null; return r.err === "timeout" ? "No encuentro esa fiesta. Revisa el código y que la tele tenga Tarima abierta." : errText(r); }
        S.session.host = !!r.host; T.store("session", S.session); publishAvatar();
        history.replaceState(null, "", location.pathname + "?p=" + code);
        S.tab = "home"; render();
        toast(r.host ? "Has entrado como anfitrión" : "¡Bienvenido, " + name + "!");
        return null;
      });
    });
  });
}

/* ---------- app shell ---------- */
function paintConn() {
  var el = document.getElementById("conn"); if (!el) return;
  var stale = S.state && Date.now() - S.lastState > 45000;
  var cls = S.linkCount === 0 ? "off" : (!S.state || stale ? "" : "on");
  var txt = S.linkCount === 0 ? "Sin conexión" : (!S.state ? "Buscando la tele…" : stale ? "La tele no responde" : "Conectado a la tele");
  el.className = "conn " + cls; el.innerHTML = "<i></i>" + txt;
}
setInterval(paintConn, 5000);

function st() { return S.state || { queue: [], guests: [], now: null, bg: {}, mode: "karaoke" }; }
function isMusic() { return st().mode === "music"; }
function mine() { return st().queue.filter(function (q) { return q.singerId === S.cid; }); }
function me() { return { tastes: S.profile.tastes || [], artists: S.profile.artists || "" }; }

function render(soft) {
  if (!S.session) { renderLogin(); return; }
  var view = document.getElementById("view");
  if (soft && view) {
    var f = document.activeElement && document.activeElement.id;
    if (/^(qInput|linkUrl|linkTitle|bgUrl|apiKey|lArt)$/.test(f)) { paintMini(); paintTabs(); return; }
    var y = view.scrollTop;
    view.innerHTML = VIEWS[S.tab](); bindView();
    view.scrollTop = y; paintMini(); paintTabs(); paintTop(); return;
  }
  $app.innerHTML =
    '<div class="topbar" id="top"></div>' +
    '<main class="view" id="view">' + VIEWS[S.tab]() + "</main>" +
    '<div id="mini"></div><nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>';
  bindView(); paintMini(); paintTabs(); paintTop(); paintConn();
}
function paintTop() {
  var el = document.getElementById("top"); if (!el) return;
  el.innerHTML = '<span class="party">' + (isMusic() ? "🎵 " : "🎤 ") + esc(st().name || "Fiesta") + " · " + esc(S.session.code) + '</span><span class="conn" id="conn"><i></i></span>';
  paintConn();
}
function paintTabs() {
  var tabs = [["home", "Inicio"], ["search", "Buscar"], ["queue", "Cola"], ["music", "Música"], ["party", "Fiesta"]];
  var n = mine().length, el = document.getElementById("tabs"); if (!el) return;
  el.innerHTML = tabs.map(function (t) {
    return '<button type="button" role="tab" aria-selected="' + (S.tab === t[0]) + '" data-tab="' + t[0] + '">' + ICON[t[0]] + t[1] +
      (t[0] === "queue" && n ? '<span class="badge">' + n + "</span>" : "") + "</button>";
  }).join("");
  el.querySelectorAll("[data-tab]").forEach(function (b) {
    b.addEventListener("click", function () { S.tab = b.dataset.tab; var v = document.getElementById("view"); v.innerHTML = VIEWS[S.tab](); v.scrollTop = 0; bindView(); paintTabs(); });
  });
}
function paintMini() {
  var el = document.getElementById("mini"); if (!el) return;
  var s = st(), n = s.now;
  if (n) {
    var pct = n.dur ? Math.min(100, (n.pos || 0) / n.dur * 100) : 0;
    var music = isMusic();
    var label = music ? "Sonando · pide " : n.phase === "intro" ? "Sube a la tarima " : n.phase === "outro" ? "Aplausos para " : "Canta ";
    var canClap = !music && n.phase === "playing" && n.singerId !== S.cid;
    el.innerHTML = '<div class="mini">' + face(n.singerId, n.singer, 38) + '<div style="flex:1;min-width:0"><b>' + esc(n.t) + "</b><small>" + label + esc(n.singer) + "</small></div>" +
      (canClap ? '<button class="clap" type="button" id="clap" aria-label="Aplaudir">👏</button>' : "") + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    var c = document.getElementById("clap");
    if (c) c.addEventListener("click", function () {
      c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
      if (navigator.vibrate) navigator.vibrate(20);
      S.conn.publish(S.topics.cmd, { type: "clap", cid: S.cid, rid: T.rand(8), auth: S.session.auth, name: S.session.name });
    });
  } else {
    var bg = s.bg || {};
    el.innerHTML = '<div class="mini" style="background:#1f2a3a">' + T.art(bg.title || "Música", 38) + '<div style="flex:1;min-width:0"><b>' +
      esc(bg.set ? (bg.title || "Música de fondo") : "La tele está libre") + "</b><small>" + (bg.set ? (bg.on ? "Música de fondo sonando" : "Música de fondo en pausa") : "Pide una canción para empezar") + "</small></div></div>";
  }
}

/* ---------- trivia ---------- */
var QL = ["A", "B", "C", "D"], quizT = null;
function paintVote(el, ch) {
  if (!S.vt || S.vt.id !== ch.id) S.vt = { id: ch.id, mine: null, deadline: Date.now() + (ch.left || 0) };
  var v = S.vt, key = "v" + ch.id + ":" + v.mine;
  el.hidden = false;
  if (el.dataset.key === key) return;   // don't rebuild under the person's finger
  el.dataset.key = key;
  el.innerHTML = '<div class="qz-in"><div class="qz-h"><span>👑 El Rey de la Tarima · ' + esc(ch.title) + '</span><b id="qzLeft">' + Math.max(0, Math.ceil((v.deadline - Date.now()) / 1000)) + '</b></div><p class="qz-q" id="qzQ">¿Quién lo ha hecho mejor?</p><div class="qz-btns">' +
    ch.names.map(function (n, i) { return '<button type="button" class="qz-b c' + (i ? 1 : 0) + (v.mine === i ? " sel" : "") + '" data-vote="' + i + '"' + (v.mine !== null ? " disabled" : "") + ">" + face(ch.ids[i], n, 64) + "<span>" + esc(n) + "</span></button>"; }).join("") + "</div>" +
    (v.mine !== null ? '<div class="qz-msg">Voto enviado. ¡Mira la tele!</div>' : "") + '<button type="button" class="qz-x" id="qzHide">Ahora no</button></div>';
  el.querySelectorAll("[data-vote]").forEach(function (b) { b.addEventListener("click", function () { v.mine = +b.dataset.vote; if (navigator.vibrate) navigator.vibrate(30); paintVote(el, ch); send({ type: "vote", vt: ch.id, pick: v.mine }).then(function (r) { if (!r.ok) toast(errText(r), true); }); }); });
  document.getElementById("qzHide").addEventListener("click", function () { el.hidden = true; S.vtHide = ch.id; });
  clearInterval(quizT);
  quizT = setInterval(function () { var l = document.getElementById("qzLeft"); if (l) l.textContent = Math.max(0, Math.ceil((v.deadline - Date.now()) / 1000)); }, 250);
}
function paintQuiz() {
  var el = document.getElementById("quiz"), ch = S.session && st().ch;
  if (ch && ch.stage === "vote" && S.vtHide !== ch.id && !isMusic()) { paintVote(el, ch); return; }
  if (ch && ch.ids && ch.ids.indexOf(S.cid) >= 0 && S.chToast !== ch.id) { S.chToast = ch.id; toast(ch.kind === "duo" ? "🎤 ¡Dúo sorpresa! Te toca cantar" : "💃 ¡Te toca bailar! Mira la tele"); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); }
  var q = S.session && st().quiz;
  if (!q || isMusic()) { el.hidden = true; el.innerHTML = ""; el.dataset.key = ""; S.qz = null; clearInterval(quizT); return; }
  if (!S.qz || S.qz.id !== q.id) S.qz = { id: q.id, mine: null, deadline: Date.now() + (q.left || 0), hide: false };
  var z = S.qz;
  if (q.stage === "ask" && q.left !== undefined) z.deadline = Math.min(z.deadline, Date.now() + q.left);
  if (z.hide) { el.hidden = true; return; }
  el.hidden = false;
  var reveal = q.stage !== "ask", got = reveal && q.res && q.res[S.cid];
  var key = "q" + q.id + ":" + q.stage + ":" + z.mine;
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  var head = '<div class="qz-h"><span>' + esc(q.about ? "Pregunta sobre " + q.about : "Pregunta musical") + '</span><b id="qzLeft">' + (reveal ? "✓" : Math.max(0, Math.ceil((z.deadline - Date.now()) / 1000))) + "</b></div>";
  var msg = "";

function bestBtn(items) {
  var b = items.filter(function (r) { return !r.ads; })[0] || items[0];
  return '<button class="btn" type="button" style="margin-bottom:10px" data-vid="' + esc(b.vid) + '" data-title="' + esc(b.t) + '" data-ch="' + esc(b.ch) + '">🎤 Cantar ya la mejor versión<br><small style="font-weight:500;opacity:.9">' + esc(b.t) + " · " + esc(b.ch) + "</small></button>";
}
function addCmd(cmd) {
  return send(cmd).then(function (r) {
    if (r.ok) toast(r.pos ? "¡Añadida! Vas en el puesto " + r.pos : "¡Añadida! Empieza ahora, mira la tele");
    else toast(errText(r), true);
    return r;
  });
}
function simple(cmd, okMsg) { return send(cmd, 15000).then(function (r) { if (!r.ok) toast(errText(r), true); else if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); return r; }); }
function goSearch(q) { S.q = q; S.yt = null; S.tab = "search"; render(); var b = document.getElementById("ytGo"); if (b) b.click(); }
function bindView() {
  var v = document.getElementById("view");
  v.querySelectorAll("[data-add]").forEach(function (b) { b.addEventListener("click", function () { addCmd({ type: "add", songId: b.dataset.add }); }); });
  v.querySelectorAll("[data-vid]").forEach(function (b) { b.addEventListener("click", function () { addCmd({ type: "add", vid: b.dataset.vid, title: b.dataset.title, ch: b.dataset.ch }); }); });
  v.querySelectorAll("[data-chip]").forEach(function (b) { b.addEventListener("click", function () { S.chip = b.dataset.chip; S.q = ""; S.tab = "search"; v.innerHTML = VIEWS.search(); v.scrollTop = 0; bindView(); paintTabs(); }); });
  v.querySelectorAll("[data-searchfor]").forEach(function (b) { b.addEventListener("click", function () { goSearch(b.dataset.searchfor); }); });
  v.querySelectorAll("[data-del]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "remove", qid: b.dataset.del }); }); });
  v.querySelectorAll("[data-up]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "up", qid: b.dataset.up }); }); });
  v.querySelectorAll("[data-act=skip]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "skip" }); }); });
  v.querySelectorAll("[data-act=auto]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "autopick" }, function (r) { return "🎲 Le toca a " + r.who + " con «" + r.t + "»"; }); }); });
  v.querySelectorAll("[data-act=ads]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "ads" }, function (r) { return r.ads ? "Marcada: la próxima vez saldrá al final" : "Marca quitada"; }); }); });
  v.querySelectorAll("[data-act=sync]").forEach(function (b) { b.addEventListener("click", function () { b.disabled = true; b.textContent = "Actualizando…"; simple({ type: "sync" }, function (r) { return "Catálogo actualizado: " + r.n + " karaokes"; }).then(function () { b.disabled = false; b.textContent = "Actualizar"; }); }); });
  v.querySelectorAll("[data-bg]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "bg", action: b.dataset.bg }); }); });
  v.querySelectorAll("[data-set=limit]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "settings", limit: b.getAttribute("aria-checked") !== "true" }); }); });
  v.querySelectorAll("[data-set=auto]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "settings", autoOn: b.getAttribute("aria-checked") !== "true" }); }); });
  v.querySelectorAll(".modes [data-mode]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "settings", mode: b.dataset.mode }); }); });

  var qi = document.getElementById("qInput");
  if (qi) {
    var refresh = function () {
      var tmp = document.createElement("div"); tmp.innerHTML = VIEWS.search();
      var form = document.getElementById("sf");
      while (form.nextSibling) form.parentNode.removeChild(form.nextSibling);
      var kids = Array.prototype.slice.call(tmp.children), after = false;
      kids.forEach(function (k) { if (after) form.parentNode.appendChild(k); if (k.id === "sf") after = true; });
      bindView();
    };
    qi.addEventListener("input", function () { S.q = qi.value; S.yt = null; refresh(); });
    var doYt = function () {
      var q = S.q.trim(), mode = st().mode; if (!q || !st().canSearch || S.ytBusy) return;
      S.ytBusy = true; refresh();
      send({ type: "search", q: q }, 15000).then(function (r) {
        S.ytBusy = false;
        if (r.ok) S.yt = { q: q, mode: mode, items: r.items || [] }; else toast(errText(r), true);
        if (S.tab === "search") refresh();
      });
    };
    document.getElementById("sf").addEventListener("submit", function (e) { e.preventDefault(); qi.blur(); doYt(); });
    var go = document.getElementById("ytGo"); if (go) go.addEventListener("click", doYt);
    document.getElementById("linkAdd").addEventListener("click", function () {
      var u = document.getElementById("linkUrl").value, t = document.getElementById("linkTitle").value.trim();
      if (!T.ytId(u)) { toast("Pega un enlace de un vídeo de YouTube.", true); return; }
      addCmd({ type: "add", url: u, title: t }).then(function (r) { if (r.ok) { document.getElementById("linkUrl").value = ""; document.getElementById("linkTitle").value = ""; } });
    });
  }
  v.querySelectorAll("[data-every]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "game", action: "quiz", every: +b.dataset.every }, "Hecho"); }); });
  v.querySelectorAll("[data-game=final]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "game", action: "final" }, function (r) { return r.later ? "El ganador sale en la tele al acabar esta canción" : "¡Mira la tele!"; }); }); });
  v.querySelectorAll("[data-game=reset]").forEach(function (b) { b.addEventListener("click", function () { if (confirm("¿Poner los puntos de todos a cero?")) simple({ type: "game", action: "reset" }, "Puntos a cero"); }); });
  v.querySelectorAll("[data-game=voice]").forEach(function (b) { b.addEventListener("click", function () { simple({ type: "game", action: "voice", on: b.getAttribute("aria-checked") !== "true" }); }); });
  var vh = document.getElementById("voiceHere");
  if (vh) vh.addEventListener("click", function () {
    S.voiceHere = !S.voiceHere; vh.setAttribute("aria-checked", S.voiceHere);
    if (S.voiceHere) { if (!window.speechSynthesis) { toast("Este navegador no tiene voz.", true); S.voiceHere = false; vh.setAttribute("aria-checked", "false"); return; } T.speak("¡Hola! Soy la voz de la fiesta.", { lang: (st().voice || {}).lang || "es-ES", gender: (st().voice || {}).gender || "f" }); toast("Deja este móvil con el volumen alto y la pantalla encendida"); }
  });
  var prof = document.getElementById("prof");
  if (prof) {
    bindProfileInputs(prof);
    document.getElementById("profSave").addEventListener("click", function () {
      S.profile = readProfile(prof); S.draftAvatar = null; T.store("profile", S.profile);
      publishAvatar();
      simple(joinCmd(), "Perfil guardado");
      render(true);
    });
  }
  var bs = document.getElementById("bgSet");
  if (bs) bs.addEventListener("click", function () {
    var u = document.getElementById("bgUrl").value;
    if (!T.playlistId(u) && !T.ytId(u)) { toast("Pega el enlace de una playlist o de un vídeo de YouTube.", true); return; }
    simple({ type: "bg", action: "set", url: u }, "Playlist puesta en la tele");
  });
  var cl = document.getElementById("copyLink");
  if (cl) cl.addEventListener("click", function () {
    var link = T.siteBase() + "?p=" + S.session.code;
    if (navigator.share) { navigator.share({ title: "Tarima", text: "Únete a la fiesta", url: link }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(function () { toast("Enlace copiado"); }, function () { toast("No se pudo copiar. Copia el enlace a mano.", true); });
  });
  var lo = document.getElementById("logout");
  if (lo) lo.addEventListener("click", function () { var name = S.session.name; S.session = null; T.store("session", null); renderLogin({ name: name }); });
}

/* ---------- start ---------- */
var p = params.get("p");
if (S.session && (!p || p.toUpperCase() === S.session.code)) {
  openConn(S.session.code); render();
  waitLinked(10000).then(function (ok) {
    if (!ok) return;
    send(joinCmd()).then(function (r) {
      if (r.ok) { S.session.host = !!r.host; T.store("session", S.session); publishAvatar(); render(true); }
      else if (r.err === "auth") { var n = S.session.name; S.session = null; T.store("session", null); renderLogin({ name: n, err: "La contraseña de la fiesta ha cambiado. Vuelve a entrar." }); }
    });
  });
} else {
  renderLogin();
}
})();
</script>
</body>
</html>
