<style>
body{overflow:auto}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-size:24px;margin:0}
.head h1 span{color:var(--accent)}
.phase{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--surface2);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.phase.live{background:var(--accent);color:#fff}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.pcard{background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:10px;margin-top:14px}
.pcard h2{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nowbox{display:flex;gap:14px;align-items:center}
.nowbox b{font-family:var(--display);font-size:24px;display:block;line-height:1.1}
.nowbox small{color:var(--muted);font-size:14px}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s linear}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fx{border:0;border-radius:12px;padding:14px 8px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--text);cursor:pointer;transition:transform .1s}
.fx:active{transform:scale(.95)}
.fx.hot{background:linear-gradient(135deg,var(--accent),#8a2bd6);color:#fff}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qopts div{border-radius:8px;padding:8px 10px;font-weight:700;font-size:14px;color:#fff}
.qopts .off{opacity:.3}
.c0{background:#e5384f}.c1{background:#2f6fe0}.c2{background:#c48f00}.c3{background:#1f9e5a}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input[type=text]{flex:1;min-width:180px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:16px;color:var(--text);outline:none}
.pts{font-family:var(--display);font-size:18px}
.icon-btn{border:0;background:var(--surface2);color:var(--text);border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none}
.login{max-width:440px;margin:8vh auto;padding:0 16px;display:grid;gap:10px}
.err{color:var(--accent2);font-size:14px;min-height:18px;margin:0}
.danger{background:#5a1a24!important;color:#ffd5db!important}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(13,11,17,.94);border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.dock button{flex:none;border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;background:var(--surface2);color:var(--text);cursor:pointer;white-space:nowrap}
.dock button:active{transform:scale(.93)}
.dock .lab{flex:none;align-self:center;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding-right:4px}
.wrap{padding-bottom:110px}
.myl{display:grid;gap:6px}
.myl .it{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 10px}
.myl .it div{flex:1;min-width:0}
.myl .it b{display:block;font-size:14.5px}
.myl .it small{color:var(--muted);font-size:12.5px}
.frm{display:grid;gap:6px}
.frm input,.frm select,.frm textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;color:var(--text);outline:none;font-family:inherit;width:100%;box-sizing:border-box}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.frm .ok{border-color:#1f9e5a}
.tabs2{display:flex;gap:6px}
.tabs2 button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800;background:var(--surface2);color:var(--muted);cursor:pointer}
.tabs2 button[aria-pressed=true]{background:linear-gradient(135deg,var(--accent),#8a2bd6);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
"use strict";
var esc = T.esc, $app = document.getElementById("app");
var M = { cid: "mod-" + (T.store("modcid") || T.rand(8)), conn: null, tp: null, state: null, pending: {}, sess: T.store("modsess"), links: 0 };
T.store("modcid", M.cid.slice(4));
var params = new URLSearchParams(location.search), pcode = (params.get("p") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

function toast(msg, bad) { var el = document.getElementById("toast"); el.textContent = msg; el.className = "toast show" + (bad ? " bad" : ""); clearTimeout(toast.t); toast.t = setTimeout(function () { el.className = "toast"; }, 2600); }
function open(code) {
  if (M.conn && M.code === code) return;
  M.code = code; M.tp = T.topics(code);
  M.conn = T.connect([M.tp.state, M.tp.res(M.cid), M.tp.config, M.tp.avAll], function (topic, m) {
    if (!m) return;
    if (topic === M.tp.state) { if (!M.state || (m.ts || 0) >= (M.state.ts || 0)) { M.state = m; M.at = Date.now(); if (M.sess) paint(); } }
    else if (topic === M.tp.config) { if (m.code === M.code) T.applyColor(m.color); }
    else if (topic === M.tp.res(M.cid) && m.rid && M.pending[m.rid]) { var p = M.pending[m.rid]; delete M.pending[m.rid]; clearTimeout(p.t); p.cb(m); }
    else if (topic.indexOf(M.tp.base + "/av/") === 0 && m.img) { (M.av = M.av || {})[topic.split("/").pop()] = m.img; }
  }, function (n) { M.links = n; var c = document.getElementById("conn"); if (c) c.textContent = n ? "● Conectado" : "○ Conectando…"; });
}
function send(cmd, ms) {
  return new Promise(function (res) {
    var rid = T.rand(10); cmd.rid = rid; cmd.cid = M.cid; cmd.spectator = true;
    if (M.sess) { cmd.auth = M.sess.auth; cmd.name = "Moderador"; }
    M.pending[rid] = { cb: res, t: setTimeout(function () { delete M.pending[rid]; res({ ok: false, err: "timeout" }); }, ms || 8000) };
    M.conn.publish(M.tp.cmd, cmd);
  });
}
var ERR = { bad: "Falta rellenar algo.", fewguests: "No hay suficientes invitados para esta prueba.", timeout: "La tele no responde. ¿Está abierta y con Empezar pulsado?", auth: "Esa clave no vale para esta fiesta.", host: "Esa clave no tiene permisos de moderador.", nosinger: "Ahora no está cantando nadie.", nopoints: "Todavía nadie tiene puntos.", musicmode: "Las preguntas solo van en modo karaoke." };
function act(cmd, ok) { return send(cmd).then(function (r) { if (!r.ok) toast(ERR[r.err] || "No ha funcionado. Prueba otra vez.", true); else if (ok) toast(ok); return r; }); }

/* ---------- login ---------- */
function login(err) {
  $app.innerHTML = '<form class="login" id="lf"><div class="loginlogo">' + T.logo() + '</div><h1 class="sign partyname">🎛️ Moderador</h1>' +
    '<p class="muted" style="margin:0">Controla el show en directo: aplausos, efectos, mensajes en la tele, concurso y reinicios.</p>' +
    '<div class="field"><label for="lc">Código de la fiesta</label><input id="lc" maxlength="8" autocapitalize="characters" value="' + esc(pcode || (M.sess && M.sess.code) || "") + '"></div>' +
    '<div class="field"><label for="lk">Clave de moderador o de anfitrión</label><input id="lk" type="password" autocomplete="current-password"></div>' +
    '<p class="err" id="lerr">' + esc(err || "") + '</p><button class="btn" type="submit" id="lb">Entrar al control</button></form>';
  document.getElementById("lf").addEventListener("submit", function (e) {
    e.preventDefault();
    var code = document.getElementById("lc").value.trim().toUpperCase(), key = document.getElementById("lk").value;
    if (!code || !key) { document.getElementById("lerr").textContent = "Escribe el código y la clave."; return; }
    var b = document.getElementById("lb"); b.disabled = true; b.textContent = "Comprobando…";
    open(code);
    T.hash(code + ":" + T.pw(key)).then(function (auth) {
      M.sess = { code: code, auth: auth };
      var wait = function (n) { return M.links > 0 || n <= 0 ? Promise.resolve() : new Promise(function (r) { setTimeout(r, 250); }).then(function () { return wait(n - 1); }); };
      return wait(40).then(function () { return send({ type: "mod", action: "ping" }); });
    }).then(function (r) {
      if (r.ok) { T.store("modsess", M.sess); paint(true); }
      else { M.sess = null; b.disabled = false; b.textContent = "Entrar al control"; document.getElementById("lerr").textContent = ERR[r.err] || "No ha funcionado."; }
    });
  });
}

/* ---------- panel ---------- */
var PH = { challenge: "Prueba", idle: "Tele libre", intro: "Presentación", playing: "Cantando", outro: "Aplausos", quiz: "Pregunta", rank: "Ranking" };
var QUICK = ["¡Otra! ¡Otra! ¡Otra!", "¡Todo el mundo de pie! 🙌", "¡Silencio, que viene lo bueno!", "¡Esto es un estadio! 🔥", "¡Que suba el siguiente valiente!", "¡Barra libre de aplausos! 👏"];
var built = false, MY = { qs: [], chs: [] }, myTab = "q";
var DOCK = ["applause", "airhorn", "drumroll", "sting", "crash", "tada", "cash", "wrong", "trombone", "ooh", "boing", "suspense"];
var VIBEN = { "": "Sin música", fiesta: "🎉 Fiesta", latino: "🌴 Latino", rock: "🎸 Rock", diva: "💋 Divas", pasarela: "💅 Pasarela", robot: "🤖 Electrónica", epica: "🎬 Épica", verbena: "🪗 Verbena", lounge: "🍸 Lounge" };
function paint(force) {
  if (!M.sess) return;
  if (!built || force) build();
  var s = M.state || {}, n = s.now, q = s.quiz, ph = s.ch ? "challenge" : n ? n.phase : (q ? "quiz" : "idle");
  if (q && q.stage) ph = q.stage === "ask" || q.stage === "reveal" ? "quiz" : ph;
  document.getElementById("pname").textContent = s.name || "Fiesta";
  var phase = document.getElementById("phase"); phase.textContent = (s.mode === "music" ? "🎵 " : "🎤 ") + (PH[ph] || ph); phase.className = "phase" + (ph !== "idle" ? " live" : "");
  var stale = !M.at || Date.now() - M.at > 15000;
  document.getElementById("now").innerHTML = stale ? '<p class="muted" style="margin:0">Esperando a la tele… Comprueba que tiene la fiesta abierta.</p>' :
    n ? '<div class="nowbox">' + face(n.singerId, n.singer) + '<div style="min-width:0"><b>' + esc(n.singer) + "</b><small>" + esc(n.t) + (n.a ? " · " + esc(n.a) : "") + "</small></div></div>" +
      '<div class="prog"><i style="width:' + (n.dur ? Math.min(100, (n.pos || 0) / n.dur * 100) : 0) + '%"></i></div>' :
    '<p class="muted" style="margin:0">Nadie canta ahora mismo.</p>';
  var qb = document.getElementById("quiz");
  if (q) {
    qb.hidden = false;
    qb.innerHTML = "<h2>Pregunta en pantalla" + (q.about ? " · " + esc(q.about) : "") + "</h2><b style='font-size:17px'>" + esc(q.q) + "</b>" +
      '<div class="qopts">' + q.o.map(function (t, i) { return '<div class="c' + i + (q.c !== undefined && q.c !== i ? " off" : "") + '">' + "ABCD"[i] + " · " + esc(t) + "</div>"; }).join("") + "</div>" +
      '<small class="muted">' + (q.stage === "ask" ? (q.n || 0) + " respuestas · quedan " + Math.ceil((q.left || 0) / 1000) + " s" : "Respuesta: " + "ABCD"[q.c]) + "</small>";
  } else { qb.hidden = true; qb.innerHTML = ""; }
  var queue = s.queue || [];
  document.getElementById("queue").innerHTML = queue.length ? queue.map(function (x, i) {
    return '<div class="row"><span class="pos">' + (i + 1) + "</span>" + face(x.singerId, x.singer, 34) + '<div class="meta"><b>' + esc(x.t) + "</b><small>" + esc(x.singer) + (x.auto ? " · 🎲" : "") + "</small></div>" +
      (i ? '<button class="icon-btn" type="button" data-up="' + esc(x.qid) + '" aria-label="Subir">↑</button>' : "") + '<button class="icon-btn" type="button" data-del="' + esc(x.qid) + '" aria-label="Quitar">✕</button></div>';
  }).join("") : '<p class="muted" style="margin:0">La cola está vacía.</p>';
  var gs = (s.guests || []).slice().sort(function (a, b) { return (b.pts || 0) - (a.pts || 0) || (b.sung || 0) - (a.sung || 0); });
  document.getElementById("guests").innerHTML = gs.length ? gs.map(function (g, i) {
    return '<div class="row"><span class="pos">' + (i + 1) + "</span>" + face(g.id, g.name, 34) + '<div class="meta"><b>' + esc(g.name) + (g.host ? " · anfitrión" : "") + "</b><small>" + (g.sung ? "🎤 " + g.sung + " cantadas" : "Aún no ha cantado") + '</small></div><span class="pts">' + (g.pts || 0) + "</span></div>";
  }).join("") : '<p class="muted" style="margin:0">Todavía no ha entrado nadie.</p>';
  var ce = s.chEvery === undefined ? 3 : s.chEvery;
  document.querySelectorAll("[data-chev]").forEach(function (b) { b.setAttribute("aria-pressed", +b.dataset.chev === ce); });
  var ev = s.quizEvery === undefined ? 1 : s.quizEvery;
  document.querySelectorAll("[data-every]").forEach(function (b) { b.setAttribute("aria-pressed", +b.dataset.every === ev); });
  document.querySelectorAll("[data-mode]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.mode === (s.mode || "karaoke")); });
  var vt = document.getElementById("voice"); if (vt) vt.setAttribute("aria-checked", !!(s.voice && s.voice.on));
  var at = document.getElementById("autoOn"); if (at) at.setAttribute("aria-checked", !!s.autoOn);
  bindLive();
}
function face(id, name, px) { px = px || 52; var img = M.av && M.av[id]; return img ? '<img src="' + img + '" alt="" style="width:' + px + "px;height:" + px + 'px;border-radius:50%;object-fit:cover;flex:none">' : T.avatar(name || "?", px); }
function build() {
  built = true;
  $app.innerHTML = '<div class="wrap"><div class="head"><div><h1>🌟 <span id="pname"></span></h1><span class="muted" style="font-size:13px">Panel de moderador · ' + esc(M.sess.code) + ' · <span id="conn">' + (M.links ? "● Conectado" : "○ Conectando…") + '</span></span></div><span class="phase" id="phase"></span></div>' +
    '<div class="cols"><div>' +
      '<div class="pcard"><h2>En directo</h2><div id="now"></div><div class="inline"><button class="btn small" type="button" data-a="skip">⏭ Saltar canción</button><button class="btn small sec" type="button" data-a="auto">🎲 Sorteo</button></div></div>' +
      '<div class="pcard" id="quiz" hidden></div>' +
      '<div class="pcard"><h2>Cola</h2><div id="queue"></div></div>' +
      '<div class="pcard"><h2>Concursantes · ranking</h2><div id="guests"></div></div>' +
    "</div><div>" +
      '<div class="pcard"><h2>🎛️ Efectos en directo</h2><div class="grid">' + Object.keys(T.sfx.NAMES).map(function (k) { return '<button class="fx' + (k === "applause" || k === "airhorn" ? " hot" : "") + '" type="button" data-sfx="' + k + '">' + T.sfx.NAMES[k] + "</button>"; }).join("") + "</div></div>" +
      '<div class="pcard"><h2>Mensaje en la tele</h2><form class="inline" id="mf"><input type="text" id="msg" maxlength="140" placeholder="¡Que no decaiga!"><button class="btn small" type="submit">Mostrar</button></form>' +
        '<label class="inline" style="font-size:14px;justify-content:flex-start"><input type="checkbox" id="speak" checked> Que lo diga también el presentador</label>' +
        '<div class="chips wrap">' + QUICK.map(function (t) { return '<button class="chip" type="button" data-quick="' + esc(t) + '">' + esc(t) + "</button>"; }).join("") + "</div></div>" +
      '<div class="pcard" id="mycard"><h2>🎂 Preguntas y pruebas de la casa</h2><div class="tabs2"><button type="button" data-my="q">❓ Preguntas</button><button type="button" data-my="c">🔥 Pruebas</button></div><div id="mybody"></div></div>' +
      '<div class="pcard"><h2>🔥 Pruebas del Reality show</h2><div class="grid">' + [["dance", "💃 Duelo de baile"], ["freeze", "🧊 Congelados"], ["guess", "🎧 Adivina la canción"], ["duo", "🎤 Dúo sorpresa"]].concat(Object.keys(T.PRUEBAS).map(function (k) { return [k, T.PRUEBAS[k].e + " " + T.PRUEBAS[k].t]; })).map(function (c, i) { return '<button class="fx' + (i < 4 ? " hot" : "") + '" type="button" data-ch="' + c[0] + '">' + c[1] + "</button>"; }).join("") + '<button class="fx hot" type="button" data-ch="">🎰 Sorpresa</button></div>' +
        '<span class="muted" style="font-size:13px">Las de baile suenan con la canción original, sin karaoke.</span>' +
        '<span class="muted" style="font-size:13px">Si alguien está cantando, la prueba sale antes de la siguiente canción. Prueba automática cada…</span><div class="chips wrap">' + [[2, "2 canciones"], [3, "3 canciones"], [5, "5 canciones"], [0, "Solo a mano"]].map(function (o) { return '<button class="chip" type="button" data-chev="' + o[0] + '">' + o[1] + "</button>"; }).join("") + "</div></div>" +
      '<div class="pcard"><h2>Concurso</h2><div class="inline"><button class="btn small" type="button" data-a="quiznow">❓ Lanzar pregunta</button><button class="btn small" type="button" data-a="final">🌟 Ganador final</button><button class="btn small sec" type="button" data-a="resetpts">Puntos a cero</button></div>' +
        '<span class="muted" style="font-size:13px">Puntos del jurado para quien está cantando</span><div class="inline">' + [100, 300, 500, 1000, -200].map(function (p) { return '<button class="btn small ' + (p < 0 ? "danger" : "sec") + '" type="button" data-jury="' + p + '">' + (p > 0 ? "+" : "") + p + "</button>"; }).join("") + "</div>" +
        '<span class="muted" style="font-size:13px">Pregunta antes de…</span><div class="chips wrap">' + [[1, "Cada canción"], [2, "Cada 2"], [3, "Cada 3"], [0, "Sin preguntas"]].map(function (o) { return '<button class="chip" type="button" data-every="' + o[0] + '">' + o[1] + "</button>"; }).join("") + "</div></div>" +
      '<div class="pcard"><h2>Programa</h2><div class="modes"><button type="button" data-mode="karaoke"><span class="mi">🎤</span><b>Reality show</b></button><button type="button" data-mode="music"><span class="mi">🎵</span><b>Música</b></button></div>' +
        '<div class="switch"><span>Presentador con voz</span><button class="tog" type="button" role="switch" id="voice" aria-label="Presentador con voz"></button></div>' +
        '<div class="switch"><span>Sorteo continuo</span><button class="tog" type="button" role="switch" id="autoOn" aria-label="Sorteo continuo"></button></div>' +
        '<div class="inline" style="margin-top:6px"><button class="btn small sec" type="button" data-a="clearq">🧹 Vaciar la cola</button><button class="btn small danger" type="button" data-a="resetall">♻️ Reiniciar fiesta</button></div>' +
        '<span class="muted" style="font-size:12.5px">Reiniciar vacía la cola y pone a cero canciones cantadas y puntos. Los invitados siguen dentro.</span></div>' +
      '<button class="btn sec small" type="button" id="out" style="margin-top:14px">Salir del panel</button>' +
    "</div></div></div>" +
    '<div class="dock" role="toolbar" aria-label="Efectos en directo"><span class="lab">🎛️ FX</span>' + DOCK.filter(function (k) { return T.sfx.NAMES[k]; }).map(function (k) { return '<button type="button" data-sfx="' + k + '">' + T.sfx.NAMES[k] + "</button>"; }).join("") + "</div>";
  paintMy(); loadMy();
  document.querySelectorAll("[data-my]").forEach(function (b) { b.addEventListener("click", function () { myTab = b.dataset.my; paintMy(); }); });
  document.querySelectorAll("[data-sfx]").forEach(function (b) { b.addEventListener("click", function () { act({ type: "mod", action: "sfx", fx: b.dataset.sfx }); }); });
  var sendMsg = function (t) { if (!t.trim()) return; act({ type: "mod", action: "msg", text: t.trim(), speak: document.getElementById("speak").checked, from: "📣 Mensaje del moderador" }, "En la tele"); };
  document.getElementById("mf").addEventListener("submit", function (e) { e.preventDefault(); var i = document.getElementById("msg"); sendMsg(i.value); i.value = ""; });
  document.querySelectorAll("[data-quick]").forEach(function (b) { b.addEventListener("click", function () { sendMsg(b.dataset.quick); }); });
  document.querySelectorAll("[data-ch]").forEach(function (b) { b.addEventListener("click", function () { act({ type: "mod", action: "challenge", kind: b.dataset.ch }).then(function (r) { if (r.ok) toast(r.later ? "Sale antes de la siguiente canción" : "¡Prueba en marcha!"); }); }); });
  document.querySelectorAll("[data-sfx]").forEach(function (b) { b.addEventListener("click", function () { if (navigator.vibrate) navigator.vibrate(15); }); });
  document.querySelectorAll("[data-chev]").forEach(function (b) { b.addEventListener("click", function () { act({ type: "game", action: "ch", every: +b.dataset.chev }, "Hecho"); }); });
  document.querySelectorAll("[data-jury]").forEach(function (b) { b.addEventListener("click", function () { act({ type: "mod", action: "jury", pts: +b.dataset.jury }, "Puntos dados"); }); });
  document.querySelectorAll("[data-every]").forEach(function (b) { b.addEventListener("click", function () { act({ type: "game", action: "quiz", every: +b.dataset.every }, "Hecho"); }); });
  document.querySelectorAll("[data-mode]").forEach(function (b) { b.addEventListener("click", function () { act({ type: "settings", mode: b.dataset.mode }, b.dataset.mode === "music" ? "Modo música" : "Modo Reality show"); }); });
  document.getElementById("voice").addEventListener("click", function () { act({ type: "game", action: "voice", on: this.getAttribute("aria-checked") !== "true" }); });
  document.getElementById("autoOn").addEventListener("click", function () { act({ type: "settings", autoOn: this.getAttribute("aria-checked") !== "true" }); });
  var A = {
    skip: function () { act({ type: "skip" }, "Saltada"); },
    auto: function () { act({ type: "autopick" }).then(function (r) { if (r.ok) toast("🎲 Le toca a " + r.who); }); },
    quiznow: function () { act({ type: "mod", action: "quiznow" }, "Pregunta en camino"); },
    final: function () { act({ type: "game", action: "final" }).then(function (r) { if (r.ok) toast(r.later ? "Sale al acabar esta canción" : "¡Mira la tele!"); }); },
    resetpts: function () { if (confirm("¿Poner los puntos de todos a cero?")) act({ type: "game", action: "reset" }, "Puntos a cero"); },
    clearq: function () { if (confirm("¿Vaciar la cola de canciones?")) act({ type: "mod", action: "clearq" }, "Cola vacía"); },
    resetall: function () { if (confirm("¿Reiniciar la fiesta? Se vacía la cola y se ponen a cero canciones y puntos.")) act({ type: "mod", action: "resetall" }, "Fiesta reiniciada"); }
  };
  document.querySelectorAll("[data-a]").forEach(function (b) { b.addEventListener("click", function () { A[b.dataset.a](); }); });
  document.getElementById("out").addEventListener("click", function () { M.sess = null; built = false; T.store("modsess", null); login(); });
}
function loadMy() { send({ type: "mod", action: "custom" }).then(function (r) { if (r && r.ok) { MY = r; paintMy(); } }); }
function whoTxt(w) { return +w === 0 ? "🙌 Todos" : +w === 1 ? "👤 1 persona" : "👥 Pareja"; }
function paintMy() {
  var el = document.getElementById("mybody"); if (!el) return;
  document.querySelectorAll("[data-my]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.my === myTab); });
  var del = function (kind, x) { return x.src === "mod" ? '<button class="icon-btn" type="button" data-del' + kind + '="' + esc(x.id) + '" aria-label="Borrar">✕</button>' : '<small title="Se edita en el panel de administrador">admin</small>'; };
  if (myTab === "q") {
    el.innerHTML = '<span class="muted" style="font-size:13px">Preguntas sobre quien celebra la fiesta. Salen mezcladas con las del concurso, o lánzalas tú con ▶.</span>' +
      '<div class="myl">' + ((MY.qs || []).length ? MY.qs.map(function (x) { return '<div class="it"><div><b>' + esc(x.q) + "</b><small>✓ " + esc(x.o[0]) + " · " + esc(x.o.slice(1).join(" · ")) + '</small></div><button class="icon-btn" type="button" data-goq="' + esc(x.id) + '" aria-label="Lanzar">▶</button>' + del("q", x) + "</div>"; }).join("") : '<p class="muted" style="margin:0">Aún no hay preguntas de la casa.</p>') + "</div>" +
      '<form class="frm" id="fq"><input id="fqQ" maxlength="160" placeholder="¿Qué pidió por su 10.º cumpleaños?" required><input id="fqA" class="ok" maxlength="80" placeholder="✓ Respuesta correcta" required><div class="two"><input id="fqB" maxlength="80" placeholder="✗ Falsa 1" required><input id="fqC" maxlength="80" placeholder="✗ Falsa 2"></div><input id="fqD" maxlength="80" placeholder="✗ Falsa 3"><button class="btn small" type="submit">➕ Añadir pregunta</button></form>';
  } else {
    el.innerHTML = '<span class="muted" style="font-size:13px">Inventa pruebas para esta fiesta. Salen más a menudo que las normales, o lánzalas tú con ▶.</span>' +
      '<div class="myl">' + ((MY.chs || []).length ? MY.chs.map(function (x) { return '<div class="it"><div><b>⭐ ' + esc(x.t) + "</b><small>" + whoTxt(x.who) + " · " + (VIBEN[x.vibe || ""] || "Sin música") + " · " + (x.dur || 40) + " s" + (x.d ? " · " + esc(x.d) : "") + '</small></div><button class="icon-btn" type="button" data-goc="' + esc(x.id) + '" aria-label="Lanzar">▶</button>' + del("c", x) + "</div>"; }).join("") : '<p class="muted" style="margin:0">Aún no hay pruebas de la casa.</p>') + "</div>" +
      '<form class="frm" id="fc"><input id="fcT" maxlength="60" placeholder="Título · p. ej. Baila como el cumpleañero" required><textarea id="fcD" rows="2" maxlength="200" placeholder="Qué hay que hacer. {n} y {m} ponen los nombres de quien le toque."></textarea>' +
      '<div class="two"><select id="fcW"><option value="2">👥 Pareja (se vota)</option><option value="1">👤 1 persona</option><option value="0">🙌 Todo el mundo</option></select><select id="fcV">' + Object.keys(VIBEN).map(function (k) { return '<option value="' + k + '"' + (k === "fiesta" ? " selected" : "") + ">" + VIBEN[k] + "</option>"; }).join("") + "</select></div>" +
      '<select id="fcS"><option value="30">30 segundos</option><option value="45" selected>45 segundos</option><option value="60">1 minuto</option><option value="90">1 min 30 s</option></select><button class="btn small" type="submit">➕ Añadir prueba</button></form>';
  }
  var g = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; };
  var fq = document.getElementById("fq"); if (fq) fq.addEventListener("submit", function (e) { e.preventDefault(); act({ type: "mod", action: "addq", q: g("fqQ"), o: [g("fqA"), g("fqB"), g("fqC"), g("fqD")].filter(Boolean) }, "Pregunta añadida").then(function (r) { if (r.ok) loadMy(); }); });
  var fc = document.getElementById("fc"); if (fc) fc.addEventListener("submit", function (e) { e.preventDefault(); act({ type: "mod", action: "addch", t: g("fcT"), d: g("fcD"), who: +g("fcW"), vibe: g("fcV"), dur: +g("fcS") }, "Prueba añadida").then(function (r) { if (r.ok) loadMy(); }); });
  el.querySelectorAll("[data-delq]").forEach(function (b) { b.onclick = function () { act({ type: "mod", action: "delq", id: b.dataset.delq }).then(loadMy); }; });
  el.querySelectorAll("[data-delc]").forEach(function (b) { b.onclick = function () { act({ type: "mod", action: "delch", id: b.dataset.delc }).then(loadMy); }; });
  el.querySelectorAll("[data-goq]").forEach(function (b) { b.onclick = function () { act({ type: "mod", action: "quiznow", qid: b.dataset.goq }).then(function (r) { if (r.ok) toast(r.later ? "Sale antes de la siguiente canción" : "¡Pregunta en pantalla!"); }); }; });
  el.querySelectorAll("[data-goc]").forEach(function (b) { b.onclick = function () { act({ type: "mod", action: "challenge", kind: "c:" + b.dataset.goc }).then(function (r) { if (r.ok) toast(r.later ? "Sale antes de la siguiente canción" : "¡Prueba en marcha!"); }); }; });
}
function bindLive() {
  document.querySelectorAll("#queue [data-del]").forEach(function (b) { b.onclick = function () { act({ type: "remove", qid: b.dataset.del }); }; });
  document.querySelectorAll("#queue [data-up]").forEach(function (b) { b.onclick = function () { act({ type: "up", qid: b.dataset.up }); }; });
}
setInterval(function () { if (M.sess && built) paint(); }, 2000);

if (M.sess && (!pcode || pcode === M.sess.code)) {
  open(M.sess.code); paint(true);
  setTimeout(function () { send({ type: "mod", action: "ping" }).then(function (r) { if (!r.ok && r.err === "auth") { M.sess = null; built = false; T.store("modsess", null); login("La clave ha cambiado. Vuelve a entrar."); } }); }, 1500);
} else { if (pcode) open(pcode); login(); }
})();
</script>
</body>
